appId: com.electron.app
productName: orch-code
directories:
  buildResources: build
files:
  - dist/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: orch-code
nsis:
  artifactName: OrchCode-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: OrchCode-${arch}.${ext}
  writeUpdateInfo: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# Allow electron-builder to rebuild native dependencies per-target arch.
# Previously set to false which prevented rebuilding for x64 when running on arm64.
# Remove or set to true so `install-app-deps` can rebuild native modules.
npmRebuild: true
publish:
  provider: github
  owner: sameer786ss
  repo: OrchCode

