appId: live.orch.app
productName: Orch
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: Orch
  icon: logo.ico
  publisherName: Orch Labs Inc.
  legalTrademarks: Orch Workspace
nsis:
  artifactName: Orch-Windows-Setup.exe
  shortcutName: Orch
  uninstallDisplayName: Orch
  createDesktopShortcut: always
  createStartMenuShortcut: true
  allowToChangeInstallationDirectory: true
  oneClick: false
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  icon: logo.icns
  extendInfo:
    - NSCameraUsageDescription: Orch requests access to the camera to support image attachments and visual agent capabilities.
    - NSMicrophoneUsageDescription: Orch requests access to the microphone to enable voice transcription and speech-to-text messaging.
    - NSDocumentsFolderUsageDescription: Orch requests access to the Documents directory to index and manage your agentic workspaces.
    - NSDownloadsFolderUsageDescription: Orch requests access to the Downloads directory to manage local workspace assets.
  notarize: false
dmg:
  artifactName: Orch-macOS-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: sameer786ss
  repo: OrchCode
