# MED-12 FIX: Changed from boilerplate 'com.electron.app' to proper app ID.
# This affects macOS Keychain access, notification permissions, and app identity.
appId: com.orchcode.app
productName: Orch Code
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
asarUnpack:
  - resources/**
win:
  executableName: Orch Code
nsis:
  artifactName: Orch Code Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  target:
    - dmg
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # HIGH-10: notarize requires Apple Developer credentials (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
  # APPLE_TEAM_ID env vars + hardened runtime entitlements). Set to false for dev builds.
  # To enable: set notarize: true and configure credentials in CI environment.
  notarize: false
dmg:
  artifactName: Orch Code-${arch}.${ext}
  writeUpdateInfo: false
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: team@orchcode.app
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: sameer786ss
  repo: OrchCode
