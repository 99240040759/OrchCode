[package]
name = "orch"
version = "0.0.1"
description = "Orch Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "orch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
orchharness = { path = "../../orchharness", features = ["local-fs"] }
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1.53.0", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
http = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart", "form"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "multipart"] }
reqwest-retry = "0.9.1"

cpal = "0.15"
hound = "3"

uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
dunce = "1"
url = "2"
rubato = "0.15"
ringbuf = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3"
portable-pty = "0.8"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
nucleo-matcher = "0.3"

encoding_rs = "0.8"
mime_guess = "2"
dashmap = "6.2.1"
moka = { version = "0.12.16", features = ["future", "sync"] }
parking_lot = "0.13.0"
arc-swap = "1.9.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sentry-tracing = "0.36.0"
secrecy = "0.10.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
