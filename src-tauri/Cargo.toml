[package]
name = "orchcode"
version = "0.1.0"
edition = "2024"

[lib]
name = "orchcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
window-vibrancy = "0.5"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }

# LLM — rig-core aliased as `rig` so `use rig::` works across all files
rig = { version = "0.38", package = "rig-core" }
futures = "0.3"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "blocking"] }

# Auth
# keyring removed — unused

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
dashmap = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
shell-words = "1"
url = "2"
open = "5"

dotenv = "0.15"
sha2 = "0.10"
dirs = "5"
tiktoken-rs = "0.6"

# File system + search (ripgrep library)
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
infer = "0.16"
mime_guess = "2"
# Office doc parsing
lopdf = "0.34"
calamine = { version = "0.26", features = ["dates"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

# Tree-sitter AST editing
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-json = "0.24"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"

# Terminal PTY
portable-pty = "0.8"

# Logging + Error tracking
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
sentry = { version = "0.34", features = ["tracing", "anyhow"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
