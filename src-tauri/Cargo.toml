[package]
name = "orchcode"
version = "0.0.1"
description = "Orch Code Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "orchcode_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
# `unstable` unlocks the multiwebview APIs used to embed the in-app browser
# (child webviews created/positioned from the frontend, resolved in ipc.rs).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

rig = { package = "rig-core", version = "0.40.0", default-features = false, features = ["derive", "reqwest", "native-tls", "pdf", "image"] }
schemars = "0.8"

tokio = { version = "1.53.0", features = ["full"] }
futures = "0.3"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls"] }

cpal = "0.15"
hound = "3"

uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
dunce = "1"
path-clean = "1"
sha2 = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }

rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
grep-regex = "0.1"
grep-searcher = "0.1"
crossbeam-channel = "0.5"
portable-pty = "0.8"
ignore = "0.4"
regex = "1.11"
urlencoding = "2.1"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }
