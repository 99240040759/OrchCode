[package]
name = "orch"
version = "0.0.1"
description = "Orch Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "orch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rig = { version = "0.45.0", default-features = false, features = ["agent", "derive", "reqwest", "rustls", "reqwest-middleware-rustls"] }
rig-memory = { version = "0.45.0", features = ["fs"] }
schemars = "0.8"

tokio = { version = "1.53.0", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
http = "1"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart", "form"] }
reqwest-middleware = { version = "0.5.2", features = ["json", "multipart"] }
reqwest-retry = "0.9.1"

cpal = "0.15"
hound = "3"

uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
dunce = "1"
sha2 = "0.10"
libc = "0.2"
url = "2"
dirs = "6"
rubato = "0.15"
ringbuf = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3"
grep-regex = "0.1"
grep-searcher = "0.1"
portable-pty = "0.8"
ignore = "0.4"
regex = "1.11"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
nucleo-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
include_dir = { version = "0.7", features = ["glob"] }
gray_matter = "0.2"
command-group = { version = "5.0", features = ["with-tokio"] }
path-clean = "1.0"

calamine = { version = "0.26", features = ["dates"] }
lopdf = "0.34"
encoding_rs = "0.8"
mime_guess = "2"

circular-buffer = "2.0.1"
similar = "3.2.1"
office_oxide = "0.1.15"
dashmap = "6.2.1"
moka = { version = "0.12.16", features = ["future", "sync"] }
envvars = "0.1.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["NSWindow", "NSView", "NSButton"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"
