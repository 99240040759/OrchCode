[package]
name = "orch"
version = "0.0.3"
description = "Orch Desktop Application"
authors = ["you"]
edition = "2021"

[lib]
name = "orch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rig = { version = "0.41.0", default-features = false, features = ["agent", "derive", "reqwest", "native-tls", "pdf"] }
schemars = "0.8"

tokio = { version = "1.53.0", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "native-tls", "multipart", "form"] }

cpal = "0.15"
hound = "3"

uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror = "2"
dunce = "1"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }

rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1.3"
grep-regex = "0.1"
grep-searcher = "0.1"
portable-pty = "0.8"
ignore = "0.4"
regex = "1.11"
urlencoding = "2.1"
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "native-tls"] }
nucleo-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
include_dir = { version = "0.7", features = ["glob"] }
gray_matter = "0.2"
command-group = { version = "5.0", features = ["with-tokio"] }
circular-buffer = "0.1"
path-clean = "1.0"

# Document parsing
calamine = { version = "0.26", features = ["dates"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
lopdf = "0.34"
encoding_rs = "0.8"
mime_guess = "2"

# HTTP / OAuth helpers
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
