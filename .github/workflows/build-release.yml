name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  release-windows:
    name: Build & Publish Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application
        run: npm run build

      - name: Build and Publish Installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

  release-mac-intel:
    name: Build & Publish macOS Intel (x64)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rosetta (for x64 emulation)
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Cache npm (x64)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-x64

      - name: Install Dependencies (x64, Rosetta)
        run: |
          arch -x86_64 /usr/local/bin/npm ci || arch -x86_64 npm ci
        env:
          npm_config_arch: x64

      - name: Build (x64 under Rosetta)
        run: |
          arch -x86_64 /usr/local/bin/npm run build || arch -x86_64 npm run build

      - name: Verify out/main exists (x64)
        run: |
          echo 'Checking for out/main/index.js'
          if [ -f out/main/index.js ]; then echo 'found out/main/index.js'; ls -la out/main; else echo 'out/main/index.js missing'; ls -la out || true; echo 'Showing dist as fallback'; ls -la dist || true; exit 1; fi

      - name: Rebuild native deps for x64
        run: |
          arch -x86_64 npx electron-builder install-app-deps --arch x64

      - name: Build and Publish DMG (x64 via Rosetta)
        run: |
          arch -x86_64 npx electron-builder --mac --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  release-mac-silicon:
    name: Build & Publish macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Application
        run: npm run build

      - name: Dump dist layout (arm64)
        run: |
          echo '--- package.json ---'
          cat package.json
          echo '--- dist tree ---'
          ls -la dist || true
          find dist -maxdepth 4 -type f -print || true

      - name: Build and Publish DMG
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
