name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  RELEASE_REPO: sameer786ss/OrchCode

jobs:
  # ─── macOS Apple Silicon arm64 ────────────────────────────────────────────
  release-mac-silicon:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make distributables
        run: npm run make -- --arch arm64 --targets @electron-forge/maker-dmg
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      - name: Collect & rename
        run: |
          mkdir -p release-upload
          find out/make -name "*.dmg" | head -1 | xargs -I{} cp {} release-upload/OrchCode-arm64-darwin.dmg
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: release-upload/OrchCode-arm64-darwin.dmg

  # ─── macOS Intel x64 ──────────────────────────────────────────────────────
  release-mac-intel:
    name: macOS Intel (x64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make distributables
        run: npm run make -- --arch x64 --targets @electron-forge/maker-dmg
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      - name: Collect & rename
        run: |
          mkdir -p release-upload
          find out/make -name "*.dmg" | head -1 | xargs -I{} cp {} release-upload/OrchCode-x64-darwin.dmg
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: release-upload/OrchCode-x64-darwin.dmg

  # ─── Windows x64 — Squirrel installer ────────────────────────────────────
  release-windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Make distributables
        run: npm run make -- --arch x64 --targets @electron-forge/maker-squirrel
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      - name: Collect & rename
        shell: bash
        run: |
          mkdir -p release-upload
          find out/make/squirrel.windows -name "OrchCode-x64-setup.exe" -exec cp {} release-upload/ \;
          find out/make/squirrel.windows -name "*.nupkg" -exec cp {} release-upload/ \;
          find out/make/squirrel.windows -name "RELEASES" -exec cp {} release-upload/ \;
          ls release-upload/
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: |
            release-upload/OrchCode-x64-setup.exe
            release-upload/*.nupkg
            release-upload/RELEASES

  # ─── Publish draft → live once all 3 platforms succeed ────────────────────
  publish-release:
    name: Publish Release
    needs: [release-windows, release-mac-silicon, release-mac-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
            const [owner, repo] = process.env.RELEASE_REPO.split('/');
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 100 });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} not found in ${owner}/${repo}`);
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, draft: false });
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
