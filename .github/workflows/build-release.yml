name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Baked into Rust binary at compile time via std::env::var()
env:
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  RELEASE_REPO: sameer786ss/OrchCode

jobs:
  # ─── Build frontend once, shared across all platform jobs ─────────────────
  build-ui:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: cd src-ui && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: src-ui/dist/
          retention-days: 1

  # ─── Windows x64 — installer + updater bundle + signature ─────────────────
  release-windows:
    name: Windows x64
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src-ui/dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis,updater --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'
        env:
          CARGO_INCREMENTAL: "0"
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
      - name: Rename + Generate latest.json
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          B=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          OUT=src-tauri/release-upload
          mkdir -p "$OUT"
          cp "$B"/*.exe        "$OUT/OrchCode-x64-setup.exe"
          cp "$B"/*.nsis.zip   "$OUT/OrchCode-x64-setup.nsis.zip"
          SIGNATURE=$(cat "$B"/*.nsis.zip.sig)
          cp "$B"/*.nsis.zip.sig "$OUT/OrchCode-x64-setup.nsis.zip.sig"
          cat > "$OUT/latest.json" <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "https://github.com/${RELEASE_REPO}/releases/download/${TAG}/OrchCode-x64-setup.nsis.zip"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${RELEASE_REPO}/releases/latest"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${RELEASE_REPO}/releases/latest"
              }
            }
          }
          EOF
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: |
            src-tauri/release-upload/OrchCode-x64-setup.exe
            src-tauri/release-upload/OrchCode-x64-setup.nsis.zip
            src-tauri/release-upload/OrchCode-x64-setup.nsis.zip.sig
            src-tauri/release-upload/latest.json

  # ─── macOS Apple Silicon arm64 — DMG only (native on macos-15) ────────────
  release-mac-silicon:
    name: macOS Apple Silicon arm64
    needs: build-ui
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src-ui/dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg,updater --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'
        env:
          CARGO_INCREMENTAL: "0"
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
      - name: Rename DMG
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" | head -n 1)
          cp "$DMG_PATH" OrchCode-arm64.dmg
      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: OrchCode-arm64.dmg

  # ─── macOS Intel x64 — DMG only (cross-compiled on macos-15) ─────────────
  release-mac-intel:
    name: macOS Intel x64
    needs: build-ui
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: src-ui/dist/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run tauri build -- --target x86_64-apple-darwin --bundles app,dmg,updater --config '{"build":{"beforeBuildCommand":"","beforeDevCommand":""}}'
        env:
          CARGO_INCREMENTAL: "0"
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
      - name: Rename DMG
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" | head -n 1)
          cp "$DMG_PATH" OrchCode-x64.dmg
      - name: Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: ${{ env.RELEASE_REPO }}
          draft: true
          files: OrchCode-x64.dmg

  # ─── Publish draft → live once all 3 platforms succeed ────────────────────
  publish-release:
    name: Publish Release
    needs: [release-windows, release-mac-silicon, release-mac-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
            const [owner, repo] = process.env.RELEASE_REPO.split('/');
            const { data: releases } = await github.rest.repos.listReleases({
              owner, repo, per_page: 100
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} not found in ${owner}/${repo}`);
            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false
            });
        env:
          RELEASE_REPO: ${{ env.RELEASE_REPO }}
