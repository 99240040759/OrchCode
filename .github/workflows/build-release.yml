name: Build & Release
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

env:
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  GH_TOKEN: ${{ secrets.RELEASE_PAT }}
  # sccache — compiler-level caching, survives dep-version changes better than artifact caching alone
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          draft: false
          prerelease: false

  # ─── macOS ────────────────────────────────────────────────────────────────
  # arm64 and x64 now run in parallel on separate runners instead of sequentially.
  # This alone cuts macOS wall-clock time roughly in half.
  build-mac:
    name: Build & Publish macOS (${{ matrix.target }})
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    needs: create-release
    strategy:
      fail-fast: false   # don't cancel the other arch if one fails
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: Orch-macOS-arm64.dmg
          - target: x86_64-apple-darwin
            artifact: Orch-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v4

      # sccache caches at the compiler-unit level — survives Cargo.lock bumps
      # better than artifact caching alone, because unchanged crates stay cached
      # even when one dep updates.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-cache caches the full target/ directory (compiled deps).
      # Works alongside sccache: rust-cache restores big dep artifacts,
      # sccache handles incremental recompilation of changed units.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-release-mac-${{ matrix.target }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm   # caches ~/.npm (the registry download cache)

      # Cache node_modules separately — skips the extraction step entirely
      # on cache hit, which saves ~30–60s vs re-extracting from npm cache.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-mac-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-mac-

      - run: npm ci --prefer-offline

      # Seed cache on main pushes with an actual RELEASE build (not cargo check).
      # cargo check produces different artifacts than --release, so the old seeder
      # was useless for tag builds. Now the cache is warm for the next tag push.
      - name: Cache Seeder (Release Build)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build macOS (${{ matrix.target }})
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Prepare macOS Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg ${{ matrix.artifact }}

      - name: Publish macOS Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact }}

  # ─── Windows ──────────────────────────────────────────────────────────────
  build-windows:
    name: Build & Publish Windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-release-win"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-win-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-win-

      - run: npm ci --prefer-offline

      - name: Cache Seeder (Release Build)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Setup Executable
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build

      - name: Prepare Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $setup = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          Copy-Item $setup -Destination Orch-Windows-Setup.exe

          $sigPath = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig).FullName
          $signature = (Get-Content $sigPath -Raw).Trim()

          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated release $tag. See the GitHub release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/sameer786ss/OrchCode/releases/download/$tag/Orch-Windows-Setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          # WriteAllText emits UTF-8 without BOM so Tauri can parse the manifest.
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json)

      - name: Publish Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: |
            Orch-Windows-Setup.exe
            latest.json
