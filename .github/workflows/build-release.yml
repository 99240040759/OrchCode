name: Build & Release
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max-old-space-size=8192"
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
  GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
  NOTION_CLIENT_ID: ${{ secrets.NOTION_CLIENT_ID }}
  NOTION_CLIENT_SECRET: ${{ secrets.NOTION_CLIENT_SECRET }}
  SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
  SLACK_CLIENT_SECRET: ${{ secrets.SLACK_CLIENT_SECRET }}
  JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
  JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  GH_TOKEN: ${{ secrets.RELEASE_PAT }}

jobs:
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          draft: false
          prerelease: false

  build-mac:
    name: Build & Publish macOS (${{ matrix.target }})
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: Orch-macOS-arm64.dmg
          - target: x86_64-apple-darwin
            artifact: Orch-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-release-mac-${{ matrix.target }}"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-mac-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-mac-${{ matrix.target }}-
            node-modules-mac-

      - run: npm ci --prefer-offline

      - name: Cache Seeder (Release Build)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Build macOS (${{ matrix.target }})
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build --target ${{ matrix.target }}

      - name: Prepare macOS Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg ${{ matrix.artifact }}

      - name: Publish macOS Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact }}

  build-windows:
    name: Build & Publish Windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-release-win"
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-win-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-win-

      - run: npm ci --prefer-offline

      - name: Cache Seeder (Release Build)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Setup Executable
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build

      - name: Prepare Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $setup = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          Copy-Item $setup -Destination Orch-Windows-Setup.exe

          $sigPath = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig).FullName
          $signature = (Get-Content $sigPath -Raw).Trim()

          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated release $tag. See the GitHub release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/sameer786ss/OrchCode/releases/download/$tag/Orch-Windows-Setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json)

      - name: Publish Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: |
            Orch-Windows-Setup.exe
            latest.json
