name: Build & Release
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

env:
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
  GH_TOKEN: ${{ secrets.RELEASE_PAT }}

jobs:
  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          draft: false
          prerelease: false

  build-mac:
    name: Build & Publish macOS
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-cache-mac"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Seeder (Cargo Check)
        if: github.ref == 'refs/heads/main'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build macOS Apple Silicon (arm64)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build --target aarch64-apple-darwin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Prepare Apple Silicon Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg Orch-macOS-arm64.dmg

      - name: Build macOS Intel (x64)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build --target x86_64-apple-darwin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Prepare Intel Asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg Orch-macOS-x64.dmg

      - name: Publish macOS Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: |
            Orch-macOS-arm64.dmg
            Orch-macOS-x64.dmg

  build-windows:
    name: Build & Publish Windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4

      - name: Disable Windows Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "orchcode-cache-win"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Seeder (Cargo Check)
        if: github.ref == 'refs/heads/main'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Windows Setup Executable
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: npx tauri build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Prepare Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $setup = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName
          Copy-Item $setup -Destination Orch-Windows-Setup.exe

          # createUpdaterArtifacts=true + the signing key produce this .sig next
          # to the installer. Its contents go verbatim into latest.json.
          $sigPath = (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig).FullName
          $signature = (Get-Content $sigPath -Raw).Trim()

          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $manifest = [ordered]@{
            version   = $version
            notes     = "Automated release $tag. See the GitHub release page for details."
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = "https://github.com/sameer786ss/OrchCode/releases/download/$tag/Orch-Windows-Setup.exe"
              }
            }
          }
          $json = $manifest | ConvertTo-Json -Depth 6
          # WriteAllText emits UTF-8 without BOM so Tauri can parse the manifest.
          [System.IO.File]::WriteAllText("$PWD\latest.json", $json)

      - name: Publish Windows Asset & Updater Manifest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          tag_name: ${{ github.ref_name }}
          files: |
            Orch-Windows-Setup.exe
            latest.json


