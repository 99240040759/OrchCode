name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  EP_TARGET_COMMITISH: main
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  create-draft:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Draft Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'sameer786ss',
              repo: 'OrchCode',
              per_page: 100
            });
            let release = releases.find(r => r.tag_name === tag);
            if (!release) {
              console.log(`Creating draft release for tag ${tag}`);
              const response = await github.rest.repos.createRelease({
                owner: 'sameer786ss',
                repo: 'OrchCode',
                tag_name: tag,
                target_commitish: 'main',
                name: tag,
                body: `Release ${tag}`,
                draft: true
              });
              release = response.data;
            } else {
              console.log(`Draft release for tag ${tag} already exists (ID: ${release.id})`);
            }

  compile:
    name: Compile Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache Electron & Builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.electron-gyp
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-
      - name: Install Dependencies
        run: npm ci
      - name: Compile Application
        run: npm run build
      - name: Upload Compilation Output
        uses: actions/upload-artifact@v4
        with:
          name: compilation-output
          path: out/
          retention-days: 1

  release-windows:
    name: Build & Publish Windows x64
    needs: [create-draft, compile]
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Disable Windows Defender
        run: Set-MpPreference -DisableRealtimeMonitoring $true
        shell: powershell
      - name: Cache Electron & Builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.electron-gyp
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-
      - name: Install Dependencies
        run: npm ci
      - name: Download Compilation Output
        uses: actions/download-artifact@v4
        with:
          name: compilation-output
          path: out/
      - name: Build and Publish Installer
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          NODE_OPTIONS: "--max_old_space_size=8192"

  release-mac-intel:
    name: Build & Publish macOS Intel (x64)
    needs: [create-draft, compile]
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js (x64)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: x64
          cache: 'npm'
      - name: Cache Electron & Builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.electron-gyp
          key: ${{ runner.os }}-intel-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-intel-electron-cache-
      - name: Install Dependencies
        run: npm ci
      - name: Download Compilation Output
        uses: actions/download-artifact@v4
        with:
          name: compilation-output
          path: out/
      - name: Build and Publish DMG (x64)
        run: npx electron-builder --mac --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: "--max_old_space_size=8192 --no-force-async-hooks-checks"

  release-mac-silicon:
    name: Build & Publish macOS Apple Silicon (arm64)
    needs: [create-draft, compile]
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Cache Electron & Builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
            ~/.electron-gyp
          key: ${{ runner.os }}-silicon-electron-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-silicon-electron-cache-
      - name: Install Dependencies
        run: npm ci
      - name: Download Compilation Output
        uses: actions/download-artifact@v4
        with:
          name: compilation-output
          path: out/
      - name: Build and Publish DMG
        run: npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          NODE_OPTIONS: "--max_old_space_size=8192"

  publish-release:
    name: Publish GitHub Release
    needs: [release-windows, release-mac-intel, release-mac-silicon]
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RELEASE_PAT }}
          script: |
            const tag = process.env.GITHUB_REF.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({
              owner: 'sameer786ss',
              repo: 'OrchCode',
              per_page: 100
            });
            const release = releases.find(r => r.tag_name === tag);
            if (!release) {
              throw new Error(`Release with tag ${tag} not found`);
            }
            await github.rest.repos.updateRelease({
              owner: 'sameer786ss',
              repo: 'OrchCode',
              release_id: release.id,
              draft: false
            });
