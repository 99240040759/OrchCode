name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
env:
  GCP_FUNCTIONS_URL: ${{ secrets.GCP_FUNCTIONS_URL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  GH_TOKEN: ${{ secrets.RELEASE_PAT }}
jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          repository: sameer786ss/OrchCode
          draft: false

  release-mac:
    name: Build & Publish macOS
    runs-on: macos-15
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish always
      - name: Remove Mac blockmap files from release
        run: |
          gh release delete-asset "${{ github.ref_name }}" "Orch-macOS-arm64.dmg.blockmap" --repo sameer786ss/OrchCode --yes || true
          gh release delete-asset "${{ github.ref_name }}" "Orch-macOS-x64.dmg.blockmap" --repo sameer786ss/OrchCode --yes || true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}

  release-windows:
    name: Build & Publish Windows
    runs-on: windows-2022
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      - name: Disable Defender
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish always
